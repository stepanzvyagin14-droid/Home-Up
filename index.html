<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Home Up</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: #0a0a0f; color: #fff; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }
    
    /* --- Экраны --- */
    .screen { width: 100%; max-width: 500px; display: none; }
    .screen.active { display: block; }
    
    /* --- Авторизация --- */
    .auth-box { background: #1a1a22; padding: 20px; border-radius: 12px; border: 1px solid #333; margin-top: 40px; }
    .auth-logo { text-align: center; font-size: 28px; font-weight: bold; color: #f0b90b; margin-bottom: 20px; letter-spacing: 2px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab { flex: 1; padding: 10px; background: #0a0a0f; border: 1px solid #333; color: #888; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; }
    .tab.active { background: #f0b90b; color: #000; border-color: #f0b90b; }
    .form-group { display: none; flex-direction: column; gap: 12px; }
    .form-group.active { display: flex; }
    input { padding: 12px; background: #0a0a0f; border: 1px solid #333; color: #fff; border-radius: 8px; font-size: 16px; outline: none; }
    input:focus { border-color: #f0b90b; }
    .btn { padding: 14px; background: #f0b90b; color: #000; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; width: 100%; transition: transform 0.1s; }
    .btn:active { transform: scale(0.98); }

    /* --- Игра --- */
    .top-bar { display: flex; justify-content: space-between; align-items: center; background: #1a1a22; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #333; }
    .balance { font-size: 18px; font-weight: bold; color: #f0b90b; }
    .offline { font-size: 18px; font-weight: bold; color: #a78bfa; }
    
    .nav { display: flex; overflow-x: auto; gap: 8px; margin-bottom: 15px; padding-bottom: 5px; }
    .nav::-webkit-scrollbar { display: none; }
    .nav-btn { background: #1a1a22; border: 1px solid #333; color: #aaa; padding: 10px 18px; border-radius: 20px; white-space: nowrap; cursor: pointer; font-weight: bold; font-size: 13px; }
    .nav-btn.active { background: #f0b90b; color: #000; border-color: #f0b90b; }
    
    .page { display: none; background: #1a1a22; padding: 15px; border-radius: 12px; border: 1px solid #333; }
    .page.active { display: block; }
    .page h2 { color: #f0b90b; margin-bottom: 15px; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; }
    
    .tap-btn { width: 170px; height: 170px; border-radius: 50%; background: #f0b90b; border: none; font-size: 24px; font-weight: bold; display: block; margin: 30px auto; cursor: pointer; box-shadow: 0 8px 0 #8a6600; transition: 0.1s; }
    .tap-btn:active { transform: translateY(8px); box-shadow: none; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
    .item-card { background: #0a0a0f; padding: 10px; border-radius: 8px; text-align: center; border: 1px solid #333; display: flex; flex-direction: column; justify-content: space-between; }
    .item-icon { font-size: 32px; margin-bottom: 5px; }
    .item-name { font-size: 12px; font-weight: bold; margin-bottom: 4px; word-break: break-word; }
    .item-price { font-size: 12px; color: #f0b90b; margin-bottom: 8px; font-weight: bold; }
    .btn-small { width: 100%; padding: 8px; font-size: 12px; border-radius: 6px; background: #f0b90b; border: none; font-weight: bold; cursor: pointer; margin-top: auto; }
    
    /* Редкости */
    .rar-common { border-bottom: 3px solid #7a7a88; }
    .rar-uncommon { border-bottom: 3px solid #7a9df8; }
    .rar-rare { border-bottom: 3px solid #a878e0; }
    .rar-epic { border-bottom: 3px solid #f088c8; }
    .rar-legendary { border-bottom: 3px solid #f0c14b; }

    #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #f0b90b; color: #000; padding: 12px 24px; border-radius: 30px; font-weight: bold; display: none; z-index: 1000; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
  </style>
</head>
<body>

  <!-- ЭКРАН АВТОРИЗАЦИИ -->
  <div id="screen-auth" class="screen active">
    <div class="auth-box">
      <div class="auth-logo">HOME UP</div>
      <div class="tabs">
        <button class="tab active" id="btn-tab-login">ВХОД</button>
        <button class="tab" id="btn-tab-reg">РЕГИСТРАЦИЯ</button>
      </div>
      
      <div id="form-login" class="form-group active">
        <input type="text" id="login-user" placeholder="Имя пользователя">
        <input type="password" id="login-pass" placeholder="Пароль">
        <button class="btn" id="btn-do-login">ВОЙТИ</button>
      </div>

      <div id="form-reg" class="form-group">
        <input type="text" id="reg-user" placeholder="Имя (от 3 символов)">
        <input type="password" id="reg-pass" placeholder="Пароль (от 4 символов)">
        <input type="password" id="reg-pass2" placeholder="Повторите пароль">
        <button class="btn" id="btn-do-reg">СОЗДАТЬ АККАУНТ</button>
      </div>
    </div>
  </div>

  <!-- ЭКРАН ИГРЫ -->
  <div id="screen-game" class="screen">
    <div class="top-bar">
      <div class="balance">🪙 <span id="ui-coins">0</span></div>
      <div class="offline">🌙 <span id="ui-offline">0</span></div>
      <button class="nav-btn" id="btn-logout" style="padding: 8px">Выйти</button>
    </div>

    <div class="nav">
      <button class="nav-btn active" data-page="tap">Тап</button>
      <button class="nav-btn" data-page="cases">Кейсы</button>
      <button class="nav-btn" data-page="inv">Инвентарь</button>
      <button class="nav-btn" data-page="market">Рынок</button>
      <button class="nav-btn" data-page="shop">Магазин</button>
    </div>

    <div id="page-tap" class="page active">
      <h2>Тапалка</h2>
      <button class="tap-btn" id="btn-tap">ТАП</button>
    </div>

    <div id="page-cases" class="page">
      <h2>Кейсы</h2>
      <div class="grid" id="grid-cases"></div>
    </div>

    <div id="page-inv" class="page">
      <h2>Инвентарь</h2>
      <div class="grid" id="grid-inv"></div>
    </div>

    <div id="page-market" class="page">
      <h2>Рынок</h2>
      <div class="grid" id="grid-market"></div>
    </div>

    <div id="page-shop" class="page">
      <h2>Магазин офлайн-коинов</h2>
      <p style="margin-bottom: 15px; color: #aaa;">Курс обмена: 5 🌙 = 1 🪙</p>
      <button class="btn" id="btn-exchange" style="margin-bottom: 10px;">Обменять ВСЁ</button>
      <button class="btn" id="btn-free" style="background: #22c55e; display: none;">👑 Забрать 1000 🪙</button>
    </div>
  </div>

  <div id="toast"></div>
  <script>
// --- НАСТРОЙКИ SUPABASE (Твой сервер) ---
const SB_URL = 'https://fsxputemwveouteusdsy.supabase.co';
const SB_KEY = 'sb_publishable_srJqOHjNtODKifwwL3j7Vg_7-ynR2L3';
const HEADERS = {
  'apikey': SB_KEY,
  'Authorization': 'Bearer ' + SB_KEY,
  'Content-Type': 'application/json',
  'Prefer': 'return=representation'
};

// --- УНИВЕРСАЛЬНЫЙ ЗАПРОС К БАЗЕ ---
async function db(path, options = {}) {
  const res = await fetch(SB_URL + '/rest/v1' + path, {
    ...options,
    headers: { ...HEADERS, ...(options.headers || {}) }
  });
  const text = await res.text();
  if (!res.ok) throw new Error(text || 'Ошибка БД');
  return text ? JSON.parse(text) : null;
}

// --- ХЕШИРОВАНИЕ ПАРОЛЯ ---
async function hashPass(pass) {
  const msgBuffer = new TextEncoder().encode('salt_hu_' + pass);
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

// --- ИГРОВЫЕ ДАННЫЕ ---
const RARITY = {
  common: { price: 2, next: 'uncommon' }, uncommon: { price: 8, next: 'rare' },
  rare: { price: 35, next: 'epic' }, epic: { price: 220, next: 'legendary' }, legendary: { price: 1600, next: null }
};

const ITEMS = [
  { name: 'P250', icon: '🔫', rar: 'common' }, { name: 'MP9', icon: '🔫', rar: 'common' },
  { name: 'Glock', icon: '🔫', rar: 'uncommon' }, { name: 'USP', icon: '🔫', rar: 'uncommon' },
  { name: 'AK-47', icon: '🔫', rar: 'rare' }, { name: 'AWP', icon: '🔫', rar: 'rare' },
  { name: 'Howl', icon: '🔫', rar: 'epic' }, { name: 'Karambit', icon: '🔪', rar: 'epic' },
  { name: 'Dragon Lore', icon: '🔫', rar: 'legendary' }, { name: 'Butterfly', icon: '🔪', rar: 'legendary' }
];

const CASES = [
  { id: '1', name: 'Стартовый', price: 25, weights: { common: 80, uncommon: 20 } },
  { id: '2', name: 'Стандарт', price: 50, weights: { common: 50, uncommon: 40, rare: 10 } },
  { id: '3', name: 'Премиум', price: 150, weights: { uncommon: 50, rare: 40, epic: 10 } }
];

// --- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ---
let user = null;
let token = localStorage.getItem('hu_tk') || null;

// --- ИНТЕРФЕЙС (UI) ---
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; 
  t.style.display = 'block';
  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(() => t.style.display = 'none', 2500);
}

function updateUI() {
  if (!user) return;
  document.getElementById('ui-coins').textContent = user.coins || 0;
  document.getElementById('ui-offline').textContent = user.offline_coins || 0;
  // Показ секретной кнопки для разработчика
  document.getElementById('btn-free').style.display = (user.username.toLowerCase() === 'baconsigma67656') ? 'block' : 'none';
}

// --- ПЕРЕКЛЮЧЕНИЕ ТАБОВ ---
document.getElementById('btn-tab-login').onclick = () => {
  document.getElementById('btn-tab-login').classList.add('active');
  document.getElementById('btn-tab-reg').classList.remove('active');
  document.getElementById('form-login').classList.add('active');
  document.getElementById('form-reg').classList.remove('active');
};
document.getElementById('btn-tab-reg').onclick = () => {
  document.getElementById('btn-tab-reg').classList.add('active');
  document.getElementById('btn-tab-login').classList.remove('active');
  document.getElementById('form-reg').classList.add('active');
  document.getElementById('form-login').classList.remove('active');
};

// --- РЕГИСТРАЦИЯ ---
document.getElementById('btn-do-reg').onclick = async () => {
  const u = document.getElementById('reg-user').value.trim();
  const p = document.getElementById('reg-pass').value;
  const p2 = document.getElementById('reg-pass2').value;

  if (u.length < 3) return showToast('Имя слишком короткое');
  if (p.length < 4) return showToast('Пароль слишком короткий');
  if (p !== p2) return showToast('Пароли не совпадают');

  try {
    const check = await db('/players?username=eq.' + u);
    if (check && check.length > 0) return showToast('Имя уже занято');

    const hashed = await hashPass(p);
    const newToken = crypto.randomUUID();
    
    const res = await db('/players', {
      method: 'POST',
      body: JSON.stringify({
        username: u,
        password: hashed,
        token: newToken,
        coins: 100,
        inventory: {},
        last_seen: Date.now()
      })
    });

    token = newToken;
    user = res[0];
    localStorage.setItem('hu_tk', token);
    startGame();
  } catch (e) {
    showToast('Ошибка: ' + e.message);
  }
};

// --- ВХОД ---
document.getElementById('btn-do-login').onclick = async () => {
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value;

  if (!u || !p) return showToast('Заполните поля');

  try {
    const res = await db('/players?username=eq.' + u);
    if (!res || res.length === 0) return showToast('Пользователь не найден');

    const hashed = await hashPass(p);
    if (res[0].password !== hashed) return showToast('Неверный пароль');

    // Подсчёт офлайн-коинов (5 шт за каждую минуту отсутствия)
    const now = Date.now();
    const gap = now - (res[0].last_seen || now);
    let gain = 0;
    if (gap > 60000) {
      gain = Math.floor(gap / 60000) * 5;
      res[0].offline_coins = (res[0].offline_coins || 0) + gain;
    }

    await db('/players?id=eq.' + res[0].id, {
      method: 'PATCH',
      body: JSON.stringify({ offline_coins: res[0].offline_coins, last_seen: now })
    });

    token = res[0].token;
    user = res[0];
    localStorage.setItem('hu_tk', token);
    startGame();

    if (gain > 0) setTimeout(() => showToast('Начислено ' + gain + ' 🌙'), 1000);
  } catch (e) {
    showToast('Ошибка: ' + e.message);
  }
};

// --- ЗАПУСК ИГРЫ ---
function startGame() {
  showScreen('screen-game');
  updateUI();
  renderCases();
  renderInv();
  renderMarket();

  // Каждые 30 секунд обновляем время онлайна, чтобы офлайн-коины капали корректно
  setInterval(async () => {
    if (!user) return;
    await db('/players?id=eq.' + user.id, { method: 'PATCH', body: JSON.stringify({ last_seen: Date.now() }) });
  }, 30000);
}

// Кнопка выхода
document.getElementById('btn-logout').onclick = () => {
  localStorage.removeItem('hu_tk');
  location.reload();
};

// Навигация по разделам
document.querySelectorAll('.nav-btn[data-page]').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.nav-btn[data-page]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + btn.dataset.page).classList.add('active');
  };
});

// --- ТАПАЛКА ---
document.getElementById('btn-tap').onclick = async () => {
  if (!user) return;
  user.coins += 1;
  updateUI();
  await db('/players?id=eq.' + user.id, { method: 'PATCH', body: JSON.stringify({ coins: user.coins }) });
};

// --- КЕЙСЫ ---
function renderCases() {
  const g = document.getElementById('grid-cases');
  g.innerHTML = CASES.map(c => `
    <div class="item-card rar-rare">
      <div class="item-icon">📦</div>
      <div class="item-name">${c.name}</div>
      <div class="item-price">🪙 ${c.price}</div>
      <button class="btn-small" onclick="openCase('${c.id}')">Открыть</button>
    </div>
  `).join('');
}

window.openCase = async (id) => {
  const c = CASES.find(x => x.id === id);
  if (user.coins < c.price) return showToast('Недостаточно монет');

  user.coins -= c.price;
  
  let total = Object.values(c.weights).reduce((a, b) => a + b, 0);
  let rand = Math.random() * total;
  let selectedRar = 'common';
  for (let [k, v] of Object.entries(c.weights)) {
    if (rand < v) { selectedRar = k; break; }
    rand -= v;
  }

  const pool = ITEMS.filter(x => x.rar === selectedRar);
  const winItem = pool[Math.floor(Math.random() * pool.length)];

  user.inventory = user.inventory || {};
  user.inventory[winItem.name] = (user.inventory[winItem.name] || 0) + 1;
  
  updateUI();
  await db('/players?id=eq.' + user.id, { method: 'PATCH', body: JSON.stringify({ coins: user.coins, inventory: user.inventory }) });
  
  showToast('Выпало: ' + winItem.name);
  renderInv();
};

// --- ИНВЕНТАРЬ ---
function renderInv() {
  const g = document.getElementById('grid-inv');
  const keys = Object.keys(user.inventory || {}).filter(k => user.inventory[k] > 0);
  
  if (keys.length === 0) {
    g.innerHTML = '<div style="color:#666; grid-column: 1/-1;">Инвентарь пуст</div>';
    return;
  }

  g.innerHTML = keys.map(name => {
    const it = ITEMS.find(x => x.name === name);
    return `
      <div class="item-card rar-${it.rar}">
        <div class="item-icon">${it.icon}</div>
        <div class="item-name">${name} (x${user.inventory[name]})</div>
        <div class="item-price">🪙 ${RARITY[it.rar].price}</div>
        <button class="btn-small" onclick="sellItem('${name}')">Продать</button>
      </div>
    `;
  }).join('');
}

window.sellItem = async (name) => {
  if (!user.inventory[name]) return;
  const it = ITEMS.find(x => x.name === name);
  user.inventory[name]--;
  if (user.inventory[name] <= 0) delete user.inventory[name];
  user.coins += RARITY[it.rar].price;
  
  updateUI();
  await db('/players?id=eq.' + user.id, { method: 'PATCH', body: JSON.stringify({ coins: user.coins, inventory: user.inventory }) });
  renderInv();
  showToast('Продано');
};

// --- РЫНОК ---
function renderMarket() {
  const g = document.getElementById('grid-market');
  g.innerHTML = ITEMS.map(it => `
    <div class="item-card rar-${it.rar}">
      <div class="item-icon">${it.icon}</div>
      <div class="item-name">${it.name}</div>
      <div class="item-price">🪙 ${RARITY[it.rar].price}</div>
      <button class="btn-small" onclick="buyItem('${it.name}')">Купить</button>
    </div>
  `).join('');
}

window.buyItem = async (name) => {
  const it = ITEMS.find(x => x.name === name);
  const price = RARITY[it.rar].price;
  
  if (user.coins < price) return showToast('Недостаточно монет');
  
  user.coins -= price;
  user.inventory = user.inventory || {};
  user.inventory[name] = (user.inventory[name] || 0) + 1;
  
  updateUI();
  await db('/players?id=eq.' + user.id, { method: 'PATCH', body: JSON.stringify({ coins: user.coins, inventory: user.inventory }) });
  renderInv();
  showToast('Куплено');
};

// --- МАГАЗИН (ОФЛАЙН КОИНЫ) ---
document.getElementById('btn-exchange').onclick = async () => {
  const oCoins = user.offline_coins || 0;
  const toExch = Math.floor(oCoins / 5) * 5;
  
  if (toExch < 5) return showToast('Мало офлайн-коинов');
  
  user.offline_coins -= toExch;
  user.coins += (toExch / 5);
  
  updateUI();
  await db('/players?id=eq.' + user.id, { method: 'PATCH', body: JSON.stringify({ offline_coins: user.offline_coins, coins: user.coins }) });
  showToast(`Обменяно ${toExch} 🌙`);
};

document.getElementById('btn-free').onclick = async () => {
  user.coins += 1000;
  updateUI();
  await db('/players?id=eq.' + user.id, { method: 'PATCH', body: JSON.stringify({ coins: user.coins }) });
  showToast('+1000 🪙');
};

// --- АВТОРИЗАЦИЯ ПРИ ЗАГРУЗКЕ (АВТОВХОД) ---
window.onload = async () => {
  if (token) {
    try {
      const res = await db('/players?token=eq.' + token);
      if (res && res.length > 0) {
        user = res[0];
        startGame();
      } else {
        localStorage.removeItem('hu_tk');
      }
    } catch (e) {
      console.log('Ошибка автовхода', e);
    }
  }
};
   </script>
